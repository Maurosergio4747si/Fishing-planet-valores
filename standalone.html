<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário de Pesca</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pesca: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6', // Teal
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#155e59',
                            900: '#164e63', // Cyan dark
                        }
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="h-screen w-full bg-teal-50 font-sans text-slate-800 flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-teal-700 text-white p-4 shadow-md flex items-center justify-between shrink-0 relative z-10">
        <div class="flex items-center gap-2">
            <div class="p-2 bg-teal-500 rounded-lg">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                </svg>
            </div>
            <h1 class="text-xl font-bold tracking-tight">PescaMaster <span class="font-light opacity-80 uppercase text-xs tracking-widest ml-2 hidden sm:inline">Gestão Pro</span></h1>
        </div>
        <div class="text-xs bg-teal-800 px-3 py-1 rounded-full border border-teal-600 flex items-center gap-2 hidden sm:flex">
            Supabase Connected
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden relative">
        <div id="error-banner" class="absolute top-4 left-1/2 -translate-x-1/2 z-50 w-full max-w-2xl px-4 hidden">
            <div class="bg-red-50 text-red-600 p-4 rounded-xl shadow-lg border border-red-200 flex justify-between items-start">
                <div>
                    <p class="font-bold text-sm">Aviso do Sistema</p>
                    <p class="text-sm mt-1" id="error-message">Erro aqui</p>
                </div>
                <button onclick="document.getElementById('error-banner').classList.add('hidden')" class="p-1 hover:bg-red-100 rounded">
                    <span class="sr-only">Fechar</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </div>
        
        <!-- Left Column: Formulários -->
        <aside class="w-full md:w-80 bg-white border-b md:border-b-0 md:border-r border-teal-100 p-6 flex flex-col gap-8 md:overflow-y-auto shrink-0 transition-all">
            
            <!-- Cadastrar Local -->
            <section>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xs font-semibold text-teal-600 uppercase tracking-wider" id="local-form-title">Cadastrar Local</h2>
                    <button id="btn-cancel-local" type="button" class="text-[10px] text-slate-500 hover:text-slate-700 underline hidden" onclick="cancelEditLocal()">Cancelar</button>
                </div>
                <form id="form-local" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1" for="input-local">Nome do Local</label>
                        <input id="input-local" required type="text" placeholder="Ex: Rio Miranda" 
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all text-sm">
                    </div>
                    <button type="submit" id="btn-local"
                        class="w-full bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white font-medium py-2 rounded-md transition-colors text-sm shadow-sm">
                        Salvar Local
                    </button>
                </form>
            </section>

            <div class="h-px bg-slate-100 shrink-0"></div>

            <!-- Cadastrar Peixe -->
            <section>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xs font-semibold text-teal-600 uppercase tracking-wider" id="peixe-form-title">Cadastrar Peixe</h2>
                    <button id="btn-cancel-peixe" type="button" class="text-[10px] text-slate-500 hover:text-slate-700 underline hidden" onclick="cancelEditPeixe()">Cancelar</button>
                </div>
                <form id="form-peixe" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1" for="select-local">Local de Pesca</label>
                        <select id="select-local" required
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm appearance-none">
                            <option value="" disabled selected>Carregando locais...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1" for="input-peixe">Nome do Peixe</label>
                        <input id="input-peixe" required type="text" placeholder="Ex: Dourado" 
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1" for="input-valor">Valor do Quilo (R$)</label>
                        <div class="relative">
                            <span class="absolute left-3 top-2 text-slate-400 text-sm">R$</span>
                            <input id="input-valor" required type="number" step="0.01" min="0" placeholder="45.00" 
                                class="w-full pl-10 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1" for="select-raridade">Raridade</label>
                        <select id="select-raridade" required
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm appearance-none">
                            <option value="comum" selected>Comum</option>
                            <option value="único">Único</option>
                            <option value="jovem">Jovem</option>
                            <option value="troféu">Troféu</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1" for="input-xp">XP por Quilo</label>
                        <input id="input-xp" required type="number" step="0.01" min="0" placeholder="50.00" 
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
                    </div>
                    <button type="submit" id="btn-peixe"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-medium py-2 rounded-md transition-colors text-sm shadow-sm mt-2">
                        Salvar Peixe
                    </button>
                </form>
            </section>
        </aside>

        <!-- Right Column: Dashboard -->
        <section class="flex-1 p-6 md:p-8 md:overflow-y-auto">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4">
                <h2 class="text-2xl font-light text-slate-900">Dashboard de Locais</h2>
                <div class="flex gap-4 text-sm" id="dashboard-stats">
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-teal-500"></span> 0 Locais</span>
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> 0 Peixes</span>
                </div>
            </div>

            <div class="flex gap-2 border-b border-teal-100 mb-6">
                <button id="tab-locais" class="px-4 py-2 text-sm font-medium border-b-2 transition-colors border-teal-600 text-teal-800" onclick="setViewMode('locais')">Por Local</button>
                <button id="tab-valor" class="px-4 py-2 text-sm font-medium border-b-2 transition-colors border-transparent text-slate-500 hover:text-slate-700" onclick="setViewMode('top_valor')">Top Valor</button>
                <button id="tab-xp" class="px-4 py-2 text-sm font-medium border-b-2 transition-colors border-transparent text-slate-500 hover:text-slate-700" onclick="setViewMode('top_xp')">Top XP</button>
            </div>
            
            <div id="dashboard-container" class="grid grid-cols-1 gap-6">
                <div class="bg-white rounded-xl shadow-sm border border-teal-100 p-12 text-center text-slate-400">
                    Carregando dados...
                </div>
            </div>
        </section>
    </main>

    <!-- Sub-footer -->
    <footer class="bg-slate-900 text-slate-400 p-3 text-[10px] flex justify-between shrink-0">
        <div>Supabase Instance: <span class="text-teal-400">fishing-spots-db-v1</span></div>
        <div class="flex gap-4 hidden sm:flex">
            <span class="text-slate-500">// SUPABASE_URL: "https://your-id.supabase.co"</span>
            <span class="text-slate-500">// SUPABASE_ANON_KEY: "eyJhbG..."</span>
        </div>
    </footer>

    <script>
        // ==========================================
        // 1. INSIRA SUAS CREDENCIAIS DO SUPABASE AQUI
        // ==========================================
        let SUPABASE_URL = 'COLOQUE_SUA_URL_AQUI'.trim();
        const SUPABASE_ANON_KEY = 'COLOQUE_SUA_CHAVE_ANON_AQUI'.trim();

        if (SUPABASE_URL && !SUPABASE_URL.includes('COLOQUE_SUA')) {
            // Strip /rest/v1 if included by mistake, and remove trailing slashes
            SUPABASE_URL = SUPABASE_URL.replace(/\/rest\/v1\/?$/, '');
            SUPABASE_URL = SUPABASE_URL.replace(/\/+$/, '');

            if (!SUPABASE_URL.startsWith('http')) {
                SUPABASE_URL = 'https://' + SUPABASE_URL;
            }
            try {
                const urlObj = new URL(SUPABASE_URL);
                if (!urlObj.hostname.includes('.') && urlObj.hostname !== 'localhost' && urlObj.hostname !== '127.0.0.1') {
                    urlObj.hostname = urlObj.hostname + '.supabase.co';
                }
                urlObj.pathname = '/';
                SUPABASE_URL = urlObj.toString().replace(/\/+$/, '');
            } catch(e) {}
        }

        // ==========================================
        // Inicialização do Supabase
        // ==========================================
        let supabase;
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error('Falha ao inicializar Supabase. Verifique as credenciais.');
        }

        // Variáveis de Estado
        let locais = [];
        let peixes = [];
        let viewMode = 'locais';
        
        // Editing IDs
        let editingLocalId = null;
        let editingPeixeId = null;

        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('tab-locais').className = `px-4 py-2 text-sm font-medium border-b-2 transition-colors ${mode === 'locais' ? 'border-teal-600 text-teal-800' : 'border-transparent text-slate-500 hover:text-slate-700'}`;
            document.getElementById('tab-valor').className = `px-4 py-2 text-sm font-medium border-b-2 transition-colors ${mode === 'top_valor' ? 'border-teal-600 text-teal-800' : 'border-transparent text-slate-500 hover:text-slate-700'}`;
            document.getElementById('tab-xp').className = `px-4 py-2 text-sm font-medium border-b-2 transition-colors ${mode === 'top_xp' ? 'border-teal-600 text-teal-800' : 'border-transparent text-slate-500 hover:text-slate-700'}`;
            renderDashboard();
        }

        // DOM Elements
        const formLocal = document.getElementById('form-local');
        const inputLocal = document.getElementById('input-local');
        const btnLocal = document.getElementById('btn-local');
        
        const formPeixe = document.getElementById('form-peixe');
        const selectLocal = document.getElementById('select-local');
        const inputPeixe = document.getElementById('input-peixe');
        const inputValor = document.getElementById('input-valor');
        const selectRaridade = document.getElementById('select-raridade');
        const inputXp = document.getElementById('input-xp');
        const btnPeixe = document.getElementById('btn-peixe');
        
        const dashboardContainer = document.getElementById('dashboard-container');

        // Formatação de Moeda
        const formatCurrency = (value) => {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        };

        // ==========================================
        // Funções de Leitura (Read)
        // ==========================================
        function showError(msg) {
            document.getElementById('error-message').textContent = msg;
            document.getElementById('error-banner').classList.remove('hidden');
        }

        async function fetchDados() {
            if (!supabase || SUPABASE_URL.includes('COLOQUE_SUA')) {
                dashboardContainer.innerHTML = `
                    <div class="bg-red-50 text-red-600 p-6 rounded-xl text-center border border-red-200">
                        <p class="font-bold">Atenção!</p>
                        <p>Você precisa configurar o SUPABASE_URL e SUPABASE_ANON_KEY no arquivo HTML.</p>
                    </div>`;
                selectLocal.innerHTML = '<option disabled selected>Configure o Supabase primeiro</option>';
                return;
            }

            try {
                // Fetch Locais
                const { data: locaisData, error: errLocais } = await supabase.from('locais_pesca').select('*').order('nome');
                if (errLocais) showError(`Erro ao buscar locais: ${errLocais.message} (Is RLS blocking?)`);
                locais = locaisData || [];

                // Fetch Peixes
                const { data: peixesData, error: errPeixes } = await supabase.from('peixes').select('*').order('nome');
                if (errPeixes) showError(`Erro ao buscar peixes: ${errPeixes.message}`);
                peixes = peixesData || [];

                renderLocaisSelect();
                renderDashboard();
            } catch (err) {
                console.error("Erro ao buscar dados:", err);
                showError(`Exceção de rede: ${err.message}`);
                dashboardContainer.innerHTML = '<p class="text-red-500 text-center">Erro ao carregar dados.</p>';
            }
        }

        // ==========================================
        // Renderização (UI)
        // ==========================================
        function renderLocaisSelect() {
            if (locais.length === 0) {
                selectLocal.innerHTML = '<option disabled selected>Nenhum local cadastrado</option>';
                return;
            }
            selectLocal.innerHTML = '<option value="" disabled selected>Selecione um local...</option>' + 
                locais.map(local => `<option value="${local.id}">${local.nome}</option>`).join('');
        }

        function renderDashboard() {
            // Update stats
            document.getElementById('dashboard-stats').innerHTML = `
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-teal-500"></span> ${locais.length} ${locais.length === 1 ? 'Local' : 'Locais'}</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> ${peixes.length} ${peixes.length === 1 ? 'Peixe' : 'Peixes'}</span>
            `;

            if (locais.length === 0) {
                dashboardContainer.innerHTML = `
                    <div class="bg-white rounded-xl shadow-sm border border-teal-100 border-dashed p-12 flex flex-col items-center justify-center text-slate-400">
                        <p class="text-center max-w-sm">Nenhum local de pesca cadastrado. Comece adicionando um novo local ao lado.</p>
                    </div>`;
                return;
            }

            if (viewMode === 'locais') {
                dashboardContainer.innerHTML = locais.map(local => {
                    const peixesDoLocal = peixes
                        .filter(p => p.local_id === local.id)
                        .sort((a, b) => b.valor_kg - a.valor_kg);
                    
                    let peixesHTML = `<div class="p-6 text-center text-slate-400 text-sm italic border-t border-slate-100">Nenhum peixe cadastrado neste local.</div>`;
                    
                    if (peixesDoLocal.length > 0) {
                        peixesHTML = `
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm whitespace-nowrap">
                                    <thead class="bg-slate-50 text-slate-500 uppercase text-[10px] tracking-wider">
                                        <tr>
                                            <th class="px-6 py-3">Espécie</th>
                                            <th class="px-6 py-3">Raridade</th>
                                            <th class="px-6 py-3">Preço (kg)</th>
                                            <th class="px-6 py-3">XP (kg)</th>
                                            <th class="px-6 py-3 text-right">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100">
                                        ${peixesDoLocal.map(peixe => `
                                            <tr class="hover:bg-slate-50/50 transition-colors">
                                                <td class="px-6 py-3 font-medium text-slate-700">${peixe.nome}</td>
                                                <td class="px-6 py-3 text-slate-600 capitalize">${peixe.raridade || 'comum'}</td>
                                                <td class="px-6 py-3 font-mono text-slate-600">${formatCurrency(peixe.valor_kg)}</td>
                                                <td class="px-6 py-3 font-mono text-slate-600">${peixe.xp_kg || 0} XP</td>
                                        <td class="px-6 py-3 text-right">
                                                    <div class="flex gap-3 justify-end">
                                                        <span onclick="editPeixe(${peixe.id}, ${peixe.local_id}, '${peixe.nome}', ${peixe.valor_kg}, '${peixe.raridade || 'comum'}', ${peixe.xp_kg || 0})" class="text-teal-600 hover:text-teal-800 transition-colors text-xs font-medium cursor-pointer">Editar</span>
                                                        <span onclick="deletePeixe(${peixe.id})" class="text-red-500 hover:text-red-700 transition-colors text-xs font-medium cursor-pointer">Excluir</span>
                                                    </div>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `;
                    }

                    return `
                        <div class="bg-white rounded-xl shadow-sm border border-teal-100 overflow-hidden">
                            <div class="bg-teal-50 px-6 py-4 border-b border-teal-100 flex justify-between items-center">
                                <h3 class="font-bold text-teal-800">${local.nome}</h3>
                                <div class="flex items-center gap-3">
                                    <span class="text-xs font-medium px-2 py-1 bg-teal-100 text-teal-700 rounded">
                                        ${peixesDoLocal.length} ${peixesDoLocal.length === 1 ? 'espécie' : 'espécies'}
                                    </span>
                                    <div class="flex gap-2">
                                        <span onclick="editLocal(${local.id}, '${local.nome}')" class="text-teal-600 hover:text-teal-800 text-xs font-medium cursor-pointer">Editar</span>
                                        <span onclick="deleteLocal(${local.id})" class="text-red-500 hover:text-red-700 text-xs font-medium cursor-pointer">Excluir</span>
                                    </div>
                                </div>
                            </div>
                            <div>${peixesHTML}</div>
                        </div>
                    `;
                }).join('');
            } else {
                let sortedPeixes = [...peixes];
                if (viewMode === 'top_valor') {
                    sortedPeixes.sort((a, b) => b.valor_kg - a.valor_kg);
                } else if (viewMode === 'top_xp') {
                    sortedPeixes.sort((a, b) => (b.xp_kg || 0) - (a.xp_kg || 0));
                }

                let contentHTML = `<div class="p-6 text-center text-slate-400 text-sm italic border-t border-slate-100">Nenhum peixe cadastrado.</div>`;
                
                if (sortedPeixes.length > 0) {
                    contentHTML = `
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm whitespace-nowrap">
                                <thead class="bg-slate-50 text-slate-500 uppercase text-[10px] tracking-wider">
                                    <tr>
                                        <th class="px-6 py-3">Posição</th>
                                        <th class="px-6 py-3">Espécie</th>
                                        <th class="px-6 py-3">Local</th>
                                        <th class="px-6 py-3">Raridade</th>
                                        <th class="px-6 py-3">Preço (kg)</th>
                                        <th class="px-6 py-3">XP (kg)</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${sortedPeixes.map((peixe, index) => {
                                        const localName = locais.find(l => l.id === peixe.local_id)?.nome || 'Local Desconhecido';
                                        return `
                                            <tr class="hover:bg-slate-50/50 transition-colors">
                                                <td class="px-6 py-3 font-mono font-medium text-slate-500">#${index + 1}</td>
                                                <td class="px-6 py-3 font-medium text-slate-700">${peixe.nome}</td>
                                                <td class="px-6 py-3 text-slate-600">${localName}</td>
                                                <td class="px-6 py-3 text-slate-600 capitalize">${peixe.raridade || 'comum'}</td>
                                                <td class="px-6 py-3 font-mono text-teal-600 font-medium">${formatCurrency(peixe.valor_kg)}</td>
                                                <td class="px-6 py-3 font-mono text-emerald-600 font-medium">${peixe.xp_kg || 0} XP</td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                }

                dashboardContainer.innerHTML = `
                    <div class="bg-white rounded-xl shadow-sm border border-teal-100 overflow-hidden">
                        <div class="bg-teal-50 px-6 py-4 border-b border-teal-100 flex justify-between items-center">
                            <h3 class="font-bold text-teal-800">${viewMode === 'top_valor' ? 'Ranking Global (Valor/kg)' : 'Ranking Global (XP/kg)'}</h3>
                        </div>
                        <div>${contentHTML}</div>
                    </div>
                `;
            }
        }

        // ==========================================
        // Eventos e Operações CRUD (Create, Update, Delete)
        // ==========================================
        window.editLocal = (id, nome) => {
            editingLocalId = id;
            inputLocal.value = nome;
            btnLocal.textContent = 'Atualizar Local';
            document.getElementById('local-form-title').textContent = 'Editar Local';
            document.getElementById('btn-cancel-local').classList.remove('hidden');
        };

        window.cancelEditLocal = () => {
            editingLocalId = null;
            inputLocal.value = '';
            btnLocal.textContent = 'Salvar Local';
            document.getElementById('local-form-title').textContent = 'Cadastrar Local';
            document.getElementById('btn-cancel-local').classList.add('hidden');
        };

        window.deleteLocal = async (id) => {
            if (!confirm('Tem certeza? Isso excluirá o local e todos os peixes dele.')) return;
            try {
                const { error } = await supabase.from('locais_pesca').delete().eq('id', id);
                if (error) showError('Erro ao excluir: ' + error.message);
                else fetchDados();
            } catch (err) {
                showError('Exceção: ' + err.message);
            }
        };

        window.editPeixe = (id, local_id, nome, valor_kg, raridade, xp_kg) => {
            editingPeixeId = id;
            selectLocal.value = local_id;
            inputPeixe.value = nome;
            inputValor.value = valor_kg;
            selectRaridade.value = raridade;
            inputXp.value = xp_kg;
            btnPeixe.textContent = 'Atualizar Peixe';
            document.getElementById('peixe-form-title').textContent = 'Editar Peixe';
            document.getElementById('btn-cancel-peixe').classList.remove('hidden');
            setViewMode('locais');
        };

        window.cancelEditPeixe = () => {
            editingPeixeId = null;
            selectLocal.value = '';
            inputPeixe.value = '';
            inputValor.value = '';
            selectRaridade.value = 'comum';
            inputXp.value = '';
            btnPeixe.textContent = 'Salvar Peixe';
            document.getElementById('peixe-form-title').textContent = 'Cadastrar Peixe';
            document.getElementById('btn-cancel-peixe').classList.add('hidden');
        };

        window.deletePeixe = async (id) => {
            if (!confirm('Tem certeza que deseja excluir este peixe?')) return;
            try {
                const { error } = await supabase.from('peixes').delete().eq('id', id);
                if (error) showError('Erro ao excluir: ' + error.message);
                else fetchDados();
            } catch (err) {
                showError('Exceção: ' + err.message);
            }
        };

        formLocal.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnLocal.disabled = true;
            const originalText = btnLocal.textContent;
            btnLocal.textContent = 'Salvando...';
            document.getElementById('error-banner').classList.add('hidden');

            try {
                let error;
                if (editingLocalId) {
                    const res = await supabase.from('locais_pesca').update({ nome: inputLocal.value }).eq('id', editingLocalId);
                    error = res.error;
                } else {
                    const res = await supabase.from('locais_pesca').insert([{ nome: inputLocal.value }]);
                    error = res.error;
                }
                
                if (error) showError('Erro: ' + error.message);
                else {
                    cancelEditLocal();
                    await fetchDados();
                }
            } catch (err) {
                showError('Exceção: ' + err.message);
            }
            
            btnLocal.disabled = false;
            if (!editingLocalId) btnLocal.textContent = 'Salvar Local';
        });

        formPeixe.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnPeixe.disabled = true;
            const originalText = btnPeixe.textContent;
            btnPeixe.textContent = 'Salvando...';
            document.getElementById('error-banner').classList.add('hidden');

            try {
                const payload = {
                    local_id: parseInt(selectLocal.value),
                    nome: inputPeixe.value,
                    valor_kg: parseFloat(inputValor.value),
                    raridade: selectRaridade.value,
                    xp_kg: parseFloat(inputXp.value)
                };

                let error;
                if (editingPeixeId) {
                    const res = await supabase.from('peixes').update(payload).eq('id', editingPeixeId);
                    error = res.error;
                } else {
                    const res = await supabase.from('peixes').insert([payload]);
                    error = res.error;
                }
                
                if (error) showError('Erro: ' + error.message);
                else {
                    cancelEditPeixe();
                    await fetchDados();
                }
            } catch (err) {
                showError('Exceção: ' + err.message);
            }
            
            btnPeixe.disabled = false;
            if (!editingPeixeId) btnPeixe.textContent = 'Salvar Peixe';
        });

        // ==========================================
        // Inicializar
        // ==========================================
        fetchDados();

        // Inscrição Real-time
        if (supabase && !SUPABASE_URL.includes('COLOQUE_SUA')) {
            supabase.channel('custom-all-channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'locais_pesca' }, fetchDados)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'peixes' }, fetchDados)
                .subscribe();
        }
    </script>
</body>
</html>
